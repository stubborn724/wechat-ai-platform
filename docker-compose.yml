version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: wechat-mysql
    restart: unless-stopped
    shm_size: 256m
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: qgEMiFzxWvunpNhY
      MYSQL_DATABASE: wechat_platform
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_use_native_aio=0

  postgres:
    image: pgvector/pgvector:pg16
    container_name: wechat-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wechat
      POSTGRES_PASSWORD: wechat123
      POSTGRES_DB: wechat_vector
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wechat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio:latest
    container_name: wechat-minio
    restart: unless-stopped
    ports:
      - "9002:9000"   # API
      - "9003:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat-celery-worker
    restart: unless-stopped
    depends_on:
      - redis
      - mysql
      - postgres
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      PG_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat-celery-beat
    restart: unless-stopped
    depends_on:
      - redis
      - mysql
      - postgres
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      PG_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  minio-data:
